<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Melyxar prototype</title>
<style>
  /* The tokens of the web interface's dark theme, so the controls tried here
     look like the ones the player will have. */
  :root {
    --accent: #c81e1e;
    --accent-bright: #e63535;
    --accent-glow: rgba(200, 30, 30, 0.35);
    --text: #f2f4f8;
    --text-soft: #aab2c0;
    --glass: rgba(20, 22, 27, 0.78);
    --border: rgba(255, 255, 255, 0.12);
    --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: transparent;
    color: var(--text); font: 15px/1.4 system-ui, sans-serif; user-select: none;
  }
  button {
    font: inherit; color: inherit; border: 0; background: none; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  }
  svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* Everything that hides and comes back moves by opacity and transform only,
     the two things a phone animates without redrawing the page. */
  .shade, .top, .bottom, .middle {
    transition: opacity 260ms var(--ease), transform 260ms var(--ease);
  }
  body.hidden .shade, body.hidden .top, body.hidden .bottom, body.hidden .middle { opacity: 0; pointer-events: none; }
  body.hidden .top { transform: translateY(-12px); }
  body.hidden .bottom { transform: translateY(12px); }

  .shade {
    position: fixed; inset: 0; pointer-events: none;
    background:
      linear-gradient(180deg, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0) 26%),
      linear-gradient(0deg, rgba(0,0,0,0.82) 0%, rgba(0,0,0,0) 38%);
  }

  .top {
    position: fixed; left: 0; right: 0; top: 0;
    padding: calc(env(safe-area-inset-top) + 14px) calc(env(safe-area-inset-right) + 18px) 0 calc(env(safe-area-inset-left) + 18px);
    display: flex; align-items: center; gap: 10px;
  }
  .title { flex: 1; min-width: 0; font-weight: 700; font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill {
    height: 40px; padding: 0 16px; border-radius: 999px;
    background: var(--glass); border: 1px solid var(--border); font-size: 14px;
  }
  .pill[aria-pressed="true"] { border-color: var(--accent-bright); color: #fff; }

  .middle {
    position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none;
  }
  .big {
    pointer-events: auto; width: 84px; height: 84px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 10px 40px var(--accent-glow);
  }
  .big svg { width: 38px; height: 38px; fill: #fff; stroke: none; }

  .bottom {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 0 calc(env(safe-area-inset-right) + 18px) calc(env(safe-area-inset-bottom) + 16px) calc(env(safe-area-inset-left) + 18px);
    display: flex; flex-direction: column; gap: 10px;
  }
  .times { display: flex; justify-content: space-between; color: var(--text-soft); font-size: 13px; font-variant-numeric: tabular-nums; }
  .bar { position: relative; height: 28px; touch-action: none; }
  .track, .buffered, .played {
    position: absolute; left: 0; top: 12px; height: 4px; border-radius: 2px;
  }
  .track { right: 0; background: rgba(255,255,255,0.22); }
  .buffered { width: 100%; transform-origin: left; background: rgba(255,255,255,0.32); }
  .played { width: 100%; transform-origin: left; background: var(--accent-bright); }
  .thumb {
    position: absolute; left: 0; top: 7px; width: 14px; height: 14px; margin-left: -7px;
    border-radius: 50%; background: #fff; box-shadow: 0 0 0 5px var(--accent-glow);
  }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .row > div { display: flex; align-items: center; gap: 6px; }
  .round { width: 48px; height: 48px; border-radius: 50%; }
  .round.main { background: var(--accent); }
  .round.main svg { fill: #fff; stroke: none; }

  /* The panel the subtitles are chosen in, as the interface draws its menus.
     Its blur is a switch, to measure what it costs over a moving picture. */
  .panel {
    position: fixed; right: calc(env(safe-area-inset-right) + 14px); bottom: calc(env(safe-area-inset-bottom) + 120px);
    width: min(320px, 80vw); padding: 10px; border-radius: 18px;
    background: var(--glass); border: 1px solid var(--border);
    opacity: 0; transform: translateY(8px) scale(0.98); pointer-events: none;
    transition: opacity 200ms var(--ease), transform 200ms var(--ease);
  }
  .panel.open { opacity: 1; transform: none; pointer-events: auto; }
  body.blurred .panel, body.blurred .pill { backdrop-filter: blur(18px) saturate(140%); background: rgba(20,22,27,0.5); }
  .panel h2 { margin: 4px 10px 8px; font-size: 12px; letter-spacing: 0.08em; color: var(--text-soft); text-transform: uppercase; }
  .choice { width: 100%; justify-content: space-between; padding: 12px; border-radius: 12px; }
  .choice[aria-checked="true"] { background: rgba(200,30,30,0.22); color: #fff; font-weight: 600; }

  .measures {
    position: fixed; left: calc(env(safe-area-inset-left) + 14px); top: calc(env(safe-area-inset-top) + 66px);
    padding: 10px 12px; border-radius: 12px; background: rgba(0,0,0,0.72);
    font: 12px/1.6 ui-monospace, monospace; display: none;
  }
  body.measuring .measures { display: block; }
  .measures b { color: var(--accent-bright); }
  .empty { position: fixed; inset: 0; display: grid; place-items: center; color: var(--text-soft); pointer-events: none; }
</style>
</head>
<body>
  <div class="shade"></div>
  <div class="empty" id="empty"></div>

  <div class="top">
    <span class="title" id="title"></span>
    <button class="pill" id="measure" aria-pressed="false"></button>
    <button class="pill" id="blur" aria-pressed="false"></button>
    <button class="pill" id="choose"></button>
    <button class="pill" id="pip" aria-label=""><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"></rect><rect x="12" y="11" width="7" height="6" rx="1"></rect></svg></button>
  </div>

  <div class="middle"><button class="big" id="big" aria-label=""><svg viewBox="0 0 24 24"><path d="M7 4 20 12 7 20Z"></path></svg></button></div>

  <div class="bottom">
    <div class="bar" id="bar">
      <div class="track"></div>
      <div class="buffered" id="buffered"></div>
      <div class="played" id="played"></div>
      <div class="thumb" id="thumb"></div>
    </div>
    <div class="times"><span id="now">0:00</span><span id="left">0:00</span></div>
    <div class="row">
      <div>
        <button class="round" id="back" aria-label=""><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7"></path><path d="M4 4v4h4"></path></svg></button>
        <button class="round main" id="toggle" aria-label=""><svg viewBox="0 0 24 24" id="toggleIcon"><path d="M7 4 20 12 7 20Z"></path></svg></button>
        <button class="round" id="forward" aria-label=""><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.4-5.7"></path><path d="M20 4v4h-4"></path></svg></button>
      </div>
      <div>
        <button class="pill" id="subs"></button>
      </div>
    </div>
  </div>

  <div class="panel" id="panel" role="menu">
    <h2 id="panelTitle"></h2>
    <div id="choices"></div>
  </div>

  <div class="measures" id="measures">
    <b id="fps">0</b> <span id="fpsSaid"></span><br>
    <b id="worst">0 ms</b> <span id="worstSaid"></span><br>
    <b id="slow">0</b> <span id="slowSaid"></span><br>
    <b id="dropped">0</b> <span id="droppedSaid"></span><br>
    <button class="pill" id="reset" style="margin-top:6px;height:30px"></button>
  </div>

<script>
  "use strict";
  const words = {
    en: {
      title: "Overlay prototype", choose: "Choose a video", measure: "Measures", blur: "Blur",
      pip: "Picture in picture", play: "Play", pause: "Pause", back: "Back 10 seconds",
      forward: "Forward 30 seconds", subs: "Subtitles", none: "None", forced: "French, forced",
      full: "French, full", english: "English, SDH", empty: "Choose a video on this phone to try the controls over it.",
      fps: "page frames/s", worst: "longest frame", slow: "frames over 20 ms", dropped: "video frames dropped", reset: "Reset",
    },
    fr: {
      title: "Prototype de superposition", choose: "Choisir une vidéo", measure: "Mesures", blur: "Flou",
      pip: "Image dans l’image", play: "Lire", pause: "Pause", back: "Reculer de 10 secondes",
      forward: "Avancer de 30 secondes", subs: "Sous-titres", none: "Aucun", forced: "Français, forcés",
      full: "Français, complets", english: "Anglais, SDH", empty: "Choisissez une vidéo du téléphone pour essayer les commandes par-dessus.",
      fps: "images/s de la page", worst: "image la plus longue", slow: "images de plus de 20 ms", dropped: "images vidéo perdues", reset: "Remettre à zéro",
    },
  };
  const said = words[(navigator.language || "en").slice(0, 2)] || words.en;
  document.documentElement.lang = said === words.fr ? "fr" : "en";
  const $ = (id) => document.getElementById(id);

  $("title").textContent = said.title;
  $("choose").textContent = said.choose;
  $("measure").textContent = said.measure;
  $("blur").textContent = said.blur;
  $("subs").textContent = said.subs;
  $("panelTitle").textContent = said.subs;
  $("empty").textContent = said.empty;
  $("pip").setAttribute("aria-label", said.pip);
  $("back").setAttribute("aria-label", said.back);
  $("forward").setAttribute("aria-label", said.forward);

  /* What the player last said, four times a second. */
  let state = { position: 0, duration: 0, buffered: 0, playing: false, dropped: 0 };
  /* Where the finger holds the bar, while it does. */
  let dragging = null;

  const clock = (ms) => {
    const all = Math.max(0, Math.floor(ms / 1000));
    const h = Math.floor(all / 3600), m = Math.floor((all % 3600) / 60), s = all % 60;
    const two = (n) => String(n).padStart(2, "0");
    return h > 0 ? `${h}:${two(m)}:${two(s)}` : `${m}:${two(s)}`;
  };

  /* Where the bar is and how wide, read by an observer when it changes rather
     than at every redraw or every move of a finger. */
  let barWidth = 0;
  let barLeft = 0;
  new ResizeObserver(([entry]) => {
    barWidth = entry.contentRect.width;
    barLeft = entry.target.getBoundingClientRect().left;
    draw();
  }).observe(document.getElementById("bar"));

  const PLAY = '<path d="M7 4 20 12 7 20Z"></path>';
  const PAUSE = '<rect x="6" y="4" width="4" height="16" rx="1"></rect><rect x="14" y="4" width="4" height="16" rx="1"></rect>';

  function draw() {
    const length = state.duration || 1;
    const at = dragging === null ? state.position : dragging;
    const share = Math.min(1, at / length);
    // Moved by transform rather than by width: the bar is not laid out again.
    $("played").style.transform = `scaleX(${share})`;
    $("buffered").style.transform = `scaleX(${Math.min(1, state.buffered / length)})`;
    $("thumb").style.transform = `translateX(${share * barWidth}px)`;
    $("now").textContent = clock(at);
    $("left").textContent = "-" + clock(state.duration - at);
    $("toggleIcon").innerHTML = state.playing ? PAUSE : PLAY;
    $("toggle").setAttribute("aria-label", state.playing ? said.pause : said.play);
    $("big").style.visibility = state.playing || !state.duration ? "hidden" : "visible";
    $("big").setAttribute("aria-label", said.play);
    $("empty").style.display = state.duration ? "none" : "grid";
  }

  window.fromNative = (told) => {
    const started = !state.playing && told.playing;
    state = told;
    draw();
    drawMeasures();
    if (started) wake();
  };

  /* The controls go away while the film plays and nobody touches anything,
     and come back at the first touch. */
  let sleeping = 0;
  function wake() {
    document.body.classList.remove("hidden");
    clearTimeout(sleeping);
    sleeping = setTimeout(() => {
      if (state.playing && dragging === null && !$("panel").classList.contains("open")) {
        document.body.classList.add("hidden");
      }
    }, 3000);
  }
  document.addEventListener("pointerdown", (event) => {
    if (document.body.classList.contains("hidden")) {
      event.preventDefault();
      event.stopPropagation();
      wake();
      return;
    }
    if (event.target === document.body || event.target.classList.contains("middle") || event.target.classList.contains("shade")) {
      $("panel").classList.remove("open");
      document.body.classList.add("hidden");
      return;
    }
    wake();
  }, true);

  $("toggle").onclick = () => (state.playing ? Native.pause() : Native.play());
  $("big").onclick = () => Native.play();
  $("back").onclick = () => Native.seekTo(Math.max(0, state.position - 10000));
  $("forward").onclick = () => Native.seekTo(Math.min(state.duration, state.position + 30000));
  $("choose").onclick = () => Native.chooseVideo();
  $("pip").onclick = () => Native.pictureInPicture();
  $("subs").onclick = () => $("panel").classList.toggle("open");

  const switchOf = (button, name) => () => {
    const on = document.body.classList.toggle(name);
    button.setAttribute("aria-pressed", String(on));
  };
  $("measure").onclick = switchOf($("measure"), "measuring");
  $("blur").onclick = switchOf($("blur"), "blurred");

  let chosen = "forced";
  for (const [key, label] of [["none", said.none], ["forced", said.forced], ["full", said.full], ["english", said.english]]) {
    const choice = document.createElement("button");
    choice.className = "choice";
    choice.setAttribute("role", "menuitemradio");
    choice.textContent = label;
    choice.onclick = () => {
      chosen = key;
      for (const other of $("choices").children) other.setAttribute("aria-checked", String(other === choice));
    };
    choice.setAttribute("aria-checked", String(key === chosen));
    $("choices").appendChild(choice);
  }

  /* Seeking by holding the bar: the bar follows the finger, and the player is
     asked once, where the finger lets go. */
  const bar = $("bar");
  const positionAt = (event) => {
    return Math.min(1, Math.max(0, (event.clientX - barLeft) / barWidth)) * state.duration;
  };
  bar.addEventListener("pointerdown", (event) => {
    if (!state.duration) return;
    bar.setPointerCapture(event.pointerId);
    dragging = positionAt(event);
    draw();
  });
  bar.addEventListener("pointermove", (event) => {
    if (dragging === null) return;
    dragging = positionAt(event);
    draw();
  });
  const letGo = () => {
    if (dragging === null) return;
    Native.seekTo(dragging);
    state.position = dragging;
    dragging = null;
    draw();
    wake();
  };
  bar.addEventListener("pointerup", letGo);
  bar.addEventListener("pointercancel", letGo);

  /* The page's own frames, over the last five seconds: how many a second, the
     longest, and how many took longer than a smooth frame allows. */
  const frames = [];
  let last = performance.now();
  function count(now) {
    frames.push({ at: now, took: now - last });
    last = now;
    while (frames.length && now - frames[0].at > 5000) frames.shift();
    requestAnimationFrame(count);
  }
  requestAnimationFrame(count);

  function drawMeasures() {
    if (!document.body.classList.contains("measuring")) return;
    const span = frames.length > 1 ? (frames[frames.length - 1].at - frames[0].at) / 1000 : 1;
    const worst = frames.reduce((most, frame) => Math.max(most, frame.took), 0);
    const slow = frames.filter((frame) => frame.took > 20).length;
    $("fps").textContent = (frames.length / span).toFixed(0);
    $("worst").textContent = `${worst.toFixed(0)} ms`;
    $("slow").textContent = String(slow);
    $("dropped").textContent = String(state.dropped);
  }
  $("fpsSaid").textContent = said.fps;
  $("worstSaid").textContent = said.worst;
  $("slowSaid").textContent = said.slow;
  $("droppedSaid").textContent = said.dropped;
  $("reset").textContent = said.reset;
  $("reset").onclick = () => Native.resetDropped();

  draw();
  wake();
</script>
</body>
</html>
