// Types Compose may compare by what they hold rather than by instance, so a
// screen given an equal answer again, or a card read again unchanged, is not
// composed anew. Each must never change once made.

// The server's answers, read once and never changed after: every one of
// them is made of vals and read-only lists.
app.melyxar.server.*

// Read-only lists, sets and maps, which nothing here changes once passed on.
kotlin.collections.List
kotlin.collections.Set
kotlin.collections.Map
