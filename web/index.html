<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Melyxar</title>
    <!-- Deux tailles plutôt qu'une : un navigateur sur écran ordinaire prend
         la petite, un écran dense prend la grande, et sans la grande il
         agrandit la petite, ce qui se voit. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <!-- L'icône dans la couleur choisie, redessinée la dernière fois et gardée
         par ce navigateur : posée ici, avant que le navigateur ne demande
         l'icône, elle évite de voir passer la rouge pendant que l'interface
         démarre. La rouge reste notée pour pouvoir y revenir. -->
    <script>
      try {
        const drawn = localStorage.getItem("melyxar.tab");
        if (drawn) {
          for (const link of document.querySelectorAll('link[rel="icon"]')) {
            link.dataset.served = link.getAttribute("href");
            link.href = drawn;
          }
        }
      } catch {}
    </script>
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
