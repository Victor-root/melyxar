[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/config",
    "crates/auth",
    "crates/database",
    "crates/ffmpeg",
    "crates/container",
    "crates/media_probe",
    "crates/sound",
    "crates/playback",
    "crates/streaming",
    "crates/library",
    "crates/jobs",
    "crates/metadata",
    "crates/app",
    "crates/server",
    "crates/melyxar",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only"
repository = "https://github.com/Victor-root/melyxar"

[workspace.dependencies]
melyxar-core = { path = "crates/core" }
melyxar-config = { path = "crates/config" }
melyxar-auth = { path = "crates/auth" }
melyxar-database = { path = "crates/database" }
melyxar-ffmpeg = { path = "crates/ffmpeg" }
melyxar-container = { path = "crates/container" }
melyxar-media-probe = { path = "crates/media_probe" }
melyxar-sound = { path = "crates/sound" }
melyxar-playback = { path = "crates/playback" }
melyxar-streaming = { path = "crates/streaming" }
melyxar-library = { path = "crates/library" }
melyxar-jobs = { path = "crates/jobs" }
melyxar-metadata = { path = "crates/metadata" }
melyxar-app = { path = "crates/app" }
melyxar-server = { path = "crates/server" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "signal", "sync", "time", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v7", "serde"] }
time = { version = "0.3", features = ["formatting", "parsing", "serde", "macros"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "uuid", "time"] }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["fs", "trace", "compression-gzip"] }
clap = { version = "4", features = ["derive"] }
tempfile = "3"
# Its TLS options were renamed at 0.13: what was "rustls-tls" is now "rustls",
# and the roots are no longer chosen by a feature at all, the platform's own
# store being verified against by default. "query" and "form" became features
# of their own in the same release, and the provider's key travels as a query.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "gzip", "query"] }
# Password hashing, the memory hard kind: a stolen database must stay useless.
argon2 = "0.6"
# For the fingerprint of a session token. Deliberately not Argon2: a token is
# already random enough to have nothing to guess, and it is checked on every
# single request, segment of video included.
sha2 = "0.11"
getrandom = "0.4"
# Reads which way up a photo is meant to be seen, which a camera writes into
# the file rather than into its pixels.
kamadak-exif = "0.6"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = "debuginfo"
