[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/config",
    "crates/database",
    "crates/ffmpeg",
    "crates/media_probe",
    "crates/playback",
    "crates/library",
    "crates/jobs",
    "crates/metadata",
    "crates/app",
    "crates/server",
    "crates/melyxar",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-only"
repository = "https://github.com/Victor-root/melyxar"

[workspace.dependencies]
melyxar-core = { path = "crates/core" }
melyxar-config = { path = "crates/config" }
melyxar-database = { path = "crates/database" }
melyxar-ffmpeg = { path = "crates/ffmpeg" }
melyxar-media-probe = { path = "crates/media_probe" }
melyxar-playback = { path = "crates/playback" }
melyxar-library = { path = "crates/library" }
melyxar-jobs = { path = "crates/jobs" }
melyxar-metadata = { path = "crates/metadata" }
melyxar-app = { path = "crates/app" }
melyxar-server = { path = "crates/server" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "signal", "sync", "time", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v7", "serde"] }
time = { version = "0.3", features = ["formatting", "parsing", "serde", "macros"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "uuid", "time"] }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "trace", "compression-gzip"] }
clap = { version = "4", features = ["derive"] }
tempfile = "3"
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = "debuginfo"
